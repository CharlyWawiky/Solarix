<script>
    // Inicializa el carrusel
    $(document).ready(function(){
        $('.carrusel').slick({
            autoplay: true, // Reproducción automática
            autoplaySpeed: 850, // Velocidad de reproducción automática en milisegundos

            infinite: true, // Bucle infinito
            speed: 800, // Velocidad de transición en milisegundos
            slidesToShow: 1, // Número de imágenes a mostrar a la vez
